<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini MOBA 5v5 - AI Reviewed</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a252f;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}#ui{position:absolute;top:9px;left:9px;color:#fff;font:14px Arial,sans-serif;text-shadow:1px 1px 3px #000;z-index:10;pointer-events:none;background:#10182099;padding:6px 8px;border-radius:7px}.joystick-container{position:absolute;bottom:28px;left:28px;width:120px;height:120px;background:#0006;border:2px solid #ffffff44;border-radius:50%;z-index:20;touch-action:none}.joystick-knob{width:50px;height:50px;background:#ffffff99;border:2px solid white;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}.attack-btn{position:absolute;bottom:30px;right:28px;width:100px;height:100px;z-index:20;touch-action:none}.attack-btn img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 5px #0009)}.centerText{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font:bold 36px Arial;color:white;text-shadow:2px 2px 5px black;display:none;z-index:30;text-align:center}#eatBtn,#recBtn{position:absolute;z-index:25;border:2px solid #ffffffaa;border-radius:50%;color:#fff;font:bold 15px Arial,sans-serif;text-shadow:1px 1px 3px #000;box-shadow:0 2px 7px #0009;touch-action:manipulation}#eatBtn{right:34px;bottom:145px;width:68px;height:68px;background:#b8792c}#recBtn{left:50%;bottom:18px;transform:translateX(-50%);width:66px;height:48px;border-radius:14px;background:#2878c7}#zoomHint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:12;color:#fff;background:#10182099;padding:4px 7px;border-radius:6px;font:11px Arial;pointer-events:none}
</style></head><body>
<div id="ui">HP: <span id="hp-val">100</span> | Kills: <span id="kill-val">0</span> | Gold: <span id="gold-val">0</span> | Level: <span id="lvl-val">1</span> <span id="buff-val"></span> | 5v5 မျှတမှု</div>
<div id="respawn-text" class="centerText" style="font-size:24px;color:#ff6b6b">ပြန်လည်အသက်ဝင်ရန် <span id="timer">3</span></div><div id="win-text" class="centerText" style="color:#2ecc71">VICTORY!</div><div id="lose-text" class="centerText" style="color:#e74c3c">DEFEAT!</div>
<div class="joystick-container" id="joystickBase"><div class="joystick-knob" id="joystickKnob"></div></div>
<div id="zoomHint">လက်နှစ်ချောင်းဖြင့် ချုံ့/ချဲ့</div><button id="eatBtn" type="button">စား</button><button id="recBtn" type="button">REC</button><div class="attack-btn" id="attackBtn"><img src="https://github.com/klay91680-glitch/gameheropng/blob/main/IMG_20261031_123549.jpg?raw=true" alt="Attack"></div><canvas id="gameCanvas"></canvas>
<script>
(()=>{
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,worldWidth=W*5,worldHeight=H*5,camera={x:0,y:0},gameOver=false,zoom=1,minZoom=.65,maxZoom=1.8;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;worldWidth=W*5;worldHeight=H*5;}addEventListener('resize',resize);resize();
// Original placeholder hero designs drawn in Canvas; no MLBB hero artwork is loaded.
const heroImgs=Array.from({length:10},()=>({complete:false,naturalWidth:0}));
function load(url){let im=new Image();im.src=url;return im}const monsterImg=load('https://cdn-icons-png.flaticon.com/512/616/616554.png'),grassImg=load('https://github.com/klay91680-glitch/gameicon/blob/main/IMG_20261031_111049.jpg?raw=true'),smallTowerImg=load('https://github.com/klay91680-glitch/gameicon/blob/main/IMG_20261031_111526.jpg?raw=true'),bigTowerImg=load('https://github.com/klay91680-glitch/gameheropng/blob/main/IMG_20261031_123701.jpg?raw=true'),bushImg=load('https://github.com/klay91680-glitch/gameicon/blob/main/IMG_20261031_111342.jpg?raw=true');
const joystickBase=document.getElementById('joystickBase'),joystickKnob=document.getElementById('joystickKnob');let joystickVector={x:0,y:0},touchId=null;
function moveJoy(t){let r=joystickBase.getBoundingClientRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),m=40;if(d>m){dx=dx/d*m;dy=dy/d*m;}joystickKnob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;joystickVector={x:dx/m,y:dy/m};}
joystickBase.addEventListener('touchstart',e=>{e.preventDefault();touchId=e.changedTouches[0].identifier;moveJoy(e.changedTouches[0]);},{passive:false});joystickBase.addEventListener('touchmove',e=>{e.preventDefault();for(let t of e.changedTouches)if(t.identifier===touchId)moveJoy(t);},{passive:false});function stopJoy(e){for(let t of e.changedTouches)if(t.identifier===touchId){touchId=null;joystickVector={x:0,y:0};joystickKnob.style.transform='translate(-50%,-50%)';}}joystickBase.addEventListener('touchend',stopJoy);joystickBase.addEventListener('touchcancel',stopJoy);
// Two-finger pinch zoom for the battlefield; ignore touches that begin on controls.
let pinchStartDistance=0,pinchStartZoom=1;
function touchDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchStartDistance=touchDistance(e.touches[0],e.touches[1]);pinchStartZoom=zoom;e.preventDefault();}},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchStartDistance>0){zoom=Math.max(minZoom,Math.min(maxZoom,pinchStartZoom*touchDistance(e.touches[0],e.touches[1])/pinchStartDistance));e.preventDefault();}},{passive:false});
canvas.addEventListener('touchend',e=>{if(e.touches.length<2)pinchStartDistance=0;},{passive:false});
canvas.addEventListener('wheel',e=>{zoom=Math.max(minZoom,Math.min(maxZoom,zoom*(e.deltaY<0?1.08:.92)));e.preventDefault();},{passive:false});

const towerRange=180,healRadius=235,towers=[];
function addTower(x,y,isEnemy,isBig){towers.push({x,y,radius:isBig?45:30,range:towerRange,hp:isBig?1000:500,maxHp:isBig?1000:500,isEnemy,cooldown:0,isBig,healRadius:isBig?healRadius:0});}
addTower(worldWidth/2,150,true,true);addTower(worldWidth*.15,worldHeight*.25,true,false);addTower(worldWidth*.85,worldHeight*.25,true,false);addTower(worldWidth*.15,worldHeight*.1,true,false);addTower(worldWidth*.85,worldHeight*.1,true,false);
addTower(worldWidth/2,worldHeight-150,false,true);addTower(worldWidth*.15,worldHeight*.75,false,false);addTower(worldWidth*.85,worldHeight*.75,false,false);addTower(worldWidth*.15,worldHeight*.9,false,false);addTower(worldWidth*.85,worldHeight*.9,false,false);
let player={x:worldWidth/2,y:worldHeight-200,radius:20,speed:2.2,hp:100,maxHp:100,isDead:false,attackCooldown:0,gold:0,level:1,imgIndex:0,team:0,buffUntil:0,buffHits:0};let allies=[],enemies=[],bullets=[],monsters=[],bushes=[],kills=0,respawnStartTime=0;
for(let i=0;i<4;i++)allies.push({x:player.x+(i-1.5)*50,y:player.y+40,radius:20,speed:2.2,hp:100,maxHp:100,attackCooldown:0,isDead:false,imgIndex:i+1,team:0,buffUntil:0,buffHits:0});
for(let i=0;i<5;i++)enemies.push({x:worldWidth/2+(i-2)*60,y:200,radius:20,speed:2.2,hp:100,maxHp:100,attackCooldown:0,isDead:false,imgIndex:i+5,team:1,buffUntil:0,buffHits:0});
for(let i=0;i<15;i++)monsters.push({x:worldWidth*.1+Math.random()*worldWidth*.8,y:worldHeight*.2+Math.random()*worldHeight*.6,radius:20,hp:200,maxHp:200,isDead:false,respawnAt:0,attackCooldown:0});for(let i=0;i<40;i++)bushes.push({x:Math.random()*worldWidth,y:Math.random()*worldHeight,size:40+Math.random()*40});
// Two giant ape bosses appear at the 2-minute mark, one on each side.
let bossSpawned=false,bosses=[];
function spawnBosses(){if(bossSpawned)return;bossSpawned=true;
  bosses.push({x:worldWidth/2,y:worldHeight*.30,radius:38,hp:800,maxHp:800,isDead:false,team:1,isBoss:true,lastHitBy:null});
  bosses.push({x:worldWidth/2,y:worldHeight*.70,radius:38,hp:800,maxHp:800,isDead:false,team:0,isBoss:true,lastHitBy:null});
}

function setText(id,v){document.getElementById(id).textContent=v;}function teamUnits(team){return team===0?[player,...allies]:enemies;}
function shoot(shooter,target,isPlayer=false,isTower=false,isMonster=false){let a=Math.atan2(target.y-shooter.y,target.x-shooter.x),dmg=isTower?12:(isMonster?8:10);if(!isTower&&shooter.buffUntil>Date.now()&&shooter.buffHits>0){dmg=Math.round(dmg*1.5);shooter.buffHits--;if(shooter.buffHits<=0)shooter.buffUntil=0;}bullets.push({x:shooter.x,y:shooter.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8,radius:isTower?8:5,damage:dmg,team:shooter.team??(shooter.isEnemy?1:0),owner:shooter,isTower,fromMonster:isMonster});}
function closest(list,from,max,filter=()=>true){let best=null,dist=max;for(const o of list){if(!filter(o))continue;let d=Math.hypot(o.x-from.x,o.y-from.y);if(d<dist){dist=d;best=o;}}return best;}
function attackNearestEnemy(){if(player.isDead||player.attackCooldown>0||gameOver)return;let target=closest(enemies,player,600,e=>!e.isDead)||null,mon=closest([...monsters,...bosses],player,600,m=>!m.isDead),tower=closest(towers.filter(t=>t.isEnemy&&t.hp>0),player,400);let d=target?Math.hypot(target.x-player.x,target.y-player.y):Infinity;if(mon&&Math.hypot(mon.x-player.x,mon.y-player.y)<d){target=mon;d=Math.hypot(mon.x-player.x,mon.y-player.y);}if(tower&&Math.hypot(tower.x-player.x,tower.y-player.y)<d)target=tower;if(target){shoot(player,target,true);player.attackCooldown=42;}}
document.getElementById('attackBtn').addEventListener('touchstart',e=>{e.preventDefault();attackNearestEnemy();},{passive:false});document.getElementById('attackBtn').addEventListener('click',attackNearestEnemy);
// Eat button: instantly consume the nearest jungle creature in close range.
function eatNearbyMonster(){if(player.isDead||gameOver)return;let m=closest(monsters,player,115,o=>!o.isDead);if(!m){setText('buff-val',' | တောကောင်အနီးကပ်သွားပါ');return;}m.lastHitBy=player;m.hp=0;killUnit(m);player.hp=Math.min(player.maxHp,player.hp+20);setText('buff-val',' | စားပြီး HP +20');}
document.getElementById('eatBtn').addEventListener('click',eatNearbyMonster);
document.getElementById('eatBtn').addEventListener('touchstart',e=>{e.preventDefault();eatNearbyMonster();},{passive:false});
// REC returns the player to the allied big tower; its healing zone restores HP over time.
let recReady=true;
function recallToBase(){if(player.isDead||gameOver||!recReady)return;player.x=worldWidth/2;player.y=worldHeight-150;player.hp=Math.min(player.maxHp,player.hp+10);recReady=false;const b=document.getElementById('recBtn');b.textContent='REC 30';let left=30;const timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);recReady=true;b.textContent='REC';}else b.textContent='REC '+left;},1000);}
document.getElementById('recBtn').addEventListener('click',recallToBase);
document.getElementById('recBtn').addEventListener('touchstart',e=>{e.preventDefault();recallToBase();},{passive:false});

function rewardMonster(killer){if(!killer)return;killer.hp=Math.min(killer.maxHp,killer.hp+3);killer.buffUntil=Date.now()+15000;killer.buffHits=5;if(killer===player){player.gold+=5;setText('gold-val',player.gold);}}
function killUnit(o){if(o.isDead)return;o.hp=0;o.isDead=true;if(o===player){respawnStartTime=Date.now();document.getElementById('respawn-text').style.display='block';return;}if(enemies.includes(o)){o.respawnAt=Date.now()+7000;if(o.team===1){kills++;setText('kill-val',kills);player.gold+=10;setText('gold-val',player.gold);}}else if(monsters.includes(o)){o.respawnAt=Date.now()+12000;let killer=o.lastHitBy;if(killer)rewardMonster(killer);}else if(bosses.includes(o)){let killer=o.lastHitBy;if(killer){killer.hp=Math.min(killer.maxHp,killer.hp+Math.ceil(killer.maxHp*.03));killer.buffUntil=Date.now()+20000;killer.buffHits=8;if(killer===player){player.gold+=30;setText('gold-val',player.gold);}}}else if(allies.includes(o)){o.respawnAt=Date.now()+7000;}}
function moveToward(unit,target,stop=90){const dx=target.x-unit.x,dy=target.y-unit.y,d=Math.hypot(dx,dy);if(d>stop){unit.x+=dx/d*unit.speed;unit.y+=dy/d*unit.speed;}return d;}
function enemyObjective(team,unit){const enemySide=team===0;const smalls=towers.filter(t=>t.isEnemy===enemySide&&!t.isBig&&t.hp>0);if(smalls.length){const outerY=team===0?Math.max(...smalls.map(t=>t.y)):Math.min(...smalls.map(t=>t.y));const front=smalls.filter(t=>Math.abs(t.y-outerY)<worldHeight*.18);return front.sort((a,b)=>Math.hypot(a.x-unit.x,a.y-unit.y)-Math.hypot(b.x-unit.x,b.y-unit.y))[0];}return towers.find(t=>t.isEnemy===enemySide&&t.isBig&&t.hp>0)||null;}
function updateAI(unit,team){
 if(unit.isDead){
   if(Date.now()>unit.respawnAt){
     unit.isDead=false;unit.hp=unit.maxHp;
     unit.x=worldWidth/2+(Math.random()-.5)*120;
     unit.y=team===0?worldHeight-200:200;
   }
   return;
 }
 const foes=team===0?enemies:[player,...allies];
 const friendlyTowers=towers.filter(t=>t.isEnemy===(team===1)&&t.hp>0);

 // 1) Prioritize a nearby enemy hero. Do not chase enemies across the whole map.
 let target=closest(foes,unit,230,o=>!o.isDead);
 let targetIsDefender=false;

 // 2) Help defend only when an enemy is actually close to a living friendly tower
 // and that enemy is also reasonably close to this AI unit.
 let bestDefense=null,bestDefenseScore=Infinity;
 for(const foe of foes){
   if(foe.isDead)continue;
   const unitDist=Math.hypot(foe.x-unit.x,foe.y-unit.y);
   if(unitDist>300)continue;
   let nearFriendlyTower=false;
   for(const tw of friendlyTowers){
     if(Math.hypot(foe.x-tw.x,foe.y-tw.y)<230){nearFriendlyTower=true;break;}
   }
   if(nearFriendlyTower&&unitDist<bestDefenseScore){bestDefense=foe;bestDefenseScore=unitDist;}
 }
 if(bestDefense && (!target || bestDefenseScore < Math.hypot(target.x-unit.x,target.y-unit.y)+35)){
   target=bestDefense;targetIsDefender=true;
 }

 // 3) Fight heroes before neutral monsters, with the same attack range/cooldown for both teams.
 if(target){
   const d=moveToward(unit,target,135);
   if(d<=155&&unit.attackCooldown<=0){shoot(unit,target);unit.attackCooldown=42;}
   if(unit.attackCooldown>0)unit.attackCooldown--;
   return;
 }

 // 4) Farm a nearby jungle creature only if no enemy hero needs attention.
 const jungle=closest([...monsters,...bosses],unit,360,m=>!m.isDead);
 if(jungle){
   const d=moveToward(unit,jungle,82);
   if(d<=100&&unit.attackCooldown<=0){shoot(unit,jungle,false,false,true);unit.attackCooldown=42;}
   if(unit.attackCooldown>0)unit.attackCooldown--;
   return;
 }

 // 5) Otherwise push the next living enemy tower.
 const objective=enemyObjective(team,unit);
 if(objective){
   const d=moveToward(unit,objective,125);
   if(d<=155&&unit.attackCooldown<=0){shoot(unit,objective);unit.attackCooldown=42;}
 }
 if(unit.attackCooldown>0)unit.attackCooldown--;
}
const gameStartTime=Date.now();
function update(){if(gameOver)return;if(!bossSpawned&&Date.now()-gameStartTime>=120000)spawnBosses();let enemyBase=towers.find(t=>t.isEnemy&&t.isBig),myBase=towers.find(t=>!t.isEnemy&&t.isBig);if(enemyBase.hp<=0){gameOver=true;player.level++;setText('lvl-val',player.level);document.getElementById('win-text').textContent='VICTORY!  LEVEL '+player.level;document.getElementById('win-text').style.display='block';return;}if(myBase.hp<=0){gameOver=true;document.getElementById('lose-text').textContent='DEFEAT!  LEVEL '+player.level;document.getElementById('lose-text').style.display='block';return;}
if(player.isDead){let left=3-Math.floor((Date.now()-respawnStartTime)/1000);if(left>0)setText('timer',left);else{player.isDead=false;player.hp=player.maxHp;player.x=worldWidth/2;player.y=worldHeight-200;document.getElementById('respawn-text').style.display='none';}}else{player.x=Math.max(30,Math.min(worldWidth-30,player.x+joystickVector.x*player.speed));player.y=Math.max(30,Math.min(worldHeight-30,player.y+joystickVector.y*player.speed));if(player.attackCooldown>0)player.attackCooldown--;}
// Both teams regenerate inside their own large base-tower healing circle.
for(const base of towers.filter(t=>t.isBig&&t.hp>0)){for(const u of teamUnits(base.isEnemy?1:0)){if(!u.isDead&&Math.hypot(u.x-base.x,u.y-base.y)<=base.healRadius)u.hp=Math.min(u.maxHp,u.hp+0.18);}}
for(const t of towers){if(t.hp<=0)continue;if(t.cooldown>0){t.cooldown--;continue;}let foes= t.isEnemy?(player.isDead?allies:[player,...allies]):enemies,target=closest(foes,t,t.range,u=>!u.isDead);if(target){shoot(t,target,false,true);t.cooldown=60;}}
allies.forEach(a=>updateAI(a,0));enemies.forEach(e=>updateAI(e,1));
for(const m of monsters){if(m.isDead&&Date.now()>m.respawnAt){m.isDead=false;m.hp=m.maxHp;m.x=worldWidth*.1+Math.random()*worldWidth*.8;m.y=worldHeight*.2+Math.random()*worldHeight*.6;}}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx;b.y+=b.vy;let hit=null;if(b.team===0){hit=closest(enemies,b,22,e=>!e.isDead)||closest([...monsters,...bosses],b,25,m=>!m.isDead);if(!hit)hit=closest(towers.filter(t=>t.isEnemy&&t.hp>0),b,25);}else{hit=closest([player,...allies],b,22,u=>!u.isDead);if(!hit)hit=closest(towers.filter(t=>!t.isEnemy&&t.hp>0),b,25);}
if(hit){if(monsters.includes(hit)||bosses.includes(hit)){hit.hp-=b.damage;hit.lastHitBy=b.owner;if(hit.hp<=0)killUnit(hit);}else if(towers.includes(hit)){hit.hp-=b.damage;}else{hit.hp-=b.damage;if(hit.hp<=0)killUnit(hit);}bullets.splice(i,1);}else if(b.x<0||b.y<0||b.x>worldWidth||b.y>worldHeight)bullets.splice(i,1);}
// Camera follows the human player.
camera.x=Math.max(0,Math.min(worldWidth-W/zoom,player.x-W/(2*zoom)));camera.y=Math.max(0,Math.min(worldHeight-H/zoom,player.y-H/(2*zoom)));setText('hp-val',Math.ceil(player.hp));document.getElementById('buff-val').textContent=player.buffUntil>Date.now()?' | Jungle Power':'';
}
function drawHealthBar(o){let w=o.radius*2;ctx.fillStyle='#111';ctx.fillRect(o.x-w/2,o.y-o.radius-12,w,5);ctx.fillStyle=o.team===1?'#ff4545':'#36dc73';ctx.fillRect(o.x-w/2,o.y-o.radius-12,w*Math.max(0,o.hp/o.maxHp),5);}
function imageOrCircle(img,x,y,w,h,color){if(img&&img.complete&&img.naturalWidth>0)ctx.drawImage(img,x-w/2,y-h/2,w,h);else{ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,Math.max(w,h)/2,0,Math.PI*2);ctx.fill();}}
// Character animation: gentle idle breathing, walking bob, facing direction, shadows, and attack flashes.
let animClock=0;
function drawHero(unit,img,color){
  const nowX=unit.x, nowY=unit.y;
  if(unit._animX===undefined){unit._animX=nowX;unit._animY=nowY;unit._face=1;unit._moving=0;}
  const dx=nowX-unit._animX, dy=nowY-unit._animY, speed=Math.hypot(dx,dy);
  if(Math.abs(dx)>.12)unit._face=dx<0?-1:1;
  unit._moving=Math.min(1,speed*.8);
  unit._animX=nowX;unit._animY=nowY;
  const phase=animClock*(unit._moving>.05?.025:.009)+(unit.imgIndex||0)*1.7;
  const bob=Math.sin(phase)*(unit._moving>.05?3.5:1.3);
  const squash=1+Math.sin(phase*2)*.025*unit._moving;
  const size=unit.radius*3;
  ctx.save();ctx.globalAlpha=.28;ctx.fillStyle='#000';ctx.beginPath();
  ctx.ellipse(unit.x,unit.y+unit.radius*.65,size*.34,size*.13,0,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(unit.x,unit.y+bob);ctx.scale(unit._face*squash,1/squash);
  if(unit._moving>.2){ctx.globalAlpha=.12+Math.sin(phase)*.04;ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,size*.56,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  // Original mini fantasy warrior: helmet, face, armor, moving limbs, and weapon.
  const idx=(unit.imgIndex||0)%10;
  const palettes=[
    ['#2477e8','#8edcff','#eaf6ff'],['#d64c46','#ffb18a','#fff0d6'],
    ['#7b49d8','#d7a7ff','#f5e8ff'],['#218c70','#8ef0c5','#e8fff5'],
    ['#d18b22','#ffe18b','#fff7dc'],['#45536b','#a8bdd7','#f0f6ff'],
    ['#b83280','#ff9bd3','#fff0fa'],['#537d31','#c0ec77','#f4ffdc'],
    ['#267d9b','#88e8ff','#e8fbff'],['#9b4f2d','#ffc19a','#fff0e2']
  ];
  const pal=palettes[idx], walk=Math.sin(phase*2)*unit._moving*4;
  // Legs
  ctx.strokeStyle='#202938';ctx.lineWidth=size*.13;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-size*.13,size*.12);ctx.lineTo(-size*.18+walk/2,size*.38);
  ctx.moveTo(size*.13,size*.12);ctx.lineTo(size*.18-walk/2,size*.38);ctx.stroke();
  // Arms and armor torso
  ctx.strokeStyle=pal[0];ctx.lineWidth=size*.18;
  ctx.beginPath();ctx.moveTo(-size*.20,-size*.12);ctx.lineTo(-size*.31-walk/3,size*.08);
  ctx.moveTo(size*.20,-size*.12);ctx.lineTo(size*.31+walk/3,size*.04);ctx.stroke();
  ctx.fillStyle=pal[0];ctx.beginPath();ctx.moveTo(-size*.24,-size*.23);ctx.lineTo(size*.24,-size*.23);ctx.lineTo(size*.19,size*.17);ctx.lineTo(-size*.19,size*.17);ctx.closePath();ctx.fill();
  ctx.strokeStyle=pal[1];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-size*.12,-size*.08);ctx.lineTo(size*.12,-size*.08);ctx.stroke();
  // Head and distinctive crest/helmet
  ctx.fillStyle='#f2c7a2';ctx.beginPath();ctx.arc(0,-size*.30,size*.16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=pal[2];ctx.beginPath();ctx.moveTo(-size*.20,-size*.32);ctx.lineTo(-size*.12,-size*.49);ctx.lineTo(size*.03,-size*.53);ctx.lineTo(size*.19,-size*.38);ctx.lineTo(size*.17,-size*.27);ctx.lineTo(-size*.18,-size*.27);ctx.closePath();ctx.fill();
  ctx.fillStyle='#18202b';ctx.fillRect(-size*.105,-size*.31,size*.07,size*.035);ctx.fillRect(size*.035,-size*.31,size*.07,size*.035);
  // Weapon: each hero gets a simple original weapon silhouette.
  ctx.strokeStyle=idx%3===0?'#f5f8ff':idx%3===1?'#f7d36b':'#9df4ff';
  ctx.lineWidth=size*.045;ctx.beginPath();ctx.moveTo(size*.29,size*.02);ctx.lineTo(size*.43,-size*.28);ctx.stroke();
  ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(size*.43,-size*.28);ctx.lineTo(size*.35,-size*.19);ctx.lineTo(size*.47,-size*.20);ctx.closePath();ctx.fill();
  if(unit.attackCooldown>34){ctx.globalAlpha=.6;ctx.strokeStyle='#fff3a6';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,size*.57,0,Math.PI*2);ctx.stroke();}
  ctx.restore();
}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2-camera.x,-H/2-camera.y);
// grass/map background
ctx.fillStyle='#315d3b';ctx.fillRect(0,0,worldWidth,worldHeight);for(let y=0;y<worldHeight;y+=90)for(let x=0;x<worldWidth;x+=90){if(grassImg.complete&&grassImg.naturalWidth)ctx.globalAlpha=.20,imageOrCircle(grassImg,x+45,y+45,88,88,'#477b48'),ctx.globalAlpha=1;else{ctx.fillStyle=((x+y)/90)%2?'#376b43':'#3b7047';ctx.fillRect(x,y,88,88);}}
// lanes and central path
ctx.strokeStyle='#9b8a62';ctx.lineWidth=42;ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(worldWidth/2,160);ctx.lineTo(worldWidth/2,worldHeight-160);ctx.stroke();ctx.globalAlpha=1;
for(const b of bushes){imageOrCircle(bushImg,b.x,b.y,b.size,b.size,'#174d2c');}
// base healing circles, equal on both teams
for(const t of towers.filter(t=>t.isBig)){ctx.beginPath();ctx.arc(t.x,t.y,t.healRadius,0,Math.PI*2);ctx.fillStyle=t.isEnemy?'#e74c3c12':'#3498db12';ctx.fill();ctx.strokeStyle=t.isEnemy?'#ff777755':'#66bbff66';ctx.lineWidth=3;ctx.stroke();}
for(const m of monsters)if(!m.isDead){imageOrCircle(monsterImg,m.x,m.y,48,48,'#b77a36');drawHealthBar(m);}for(const b of bosses)if(!b.isDead){imageOrCircle(monsterImg,b.x,b.y,90,90,'#9b59b6');ctx.fillStyle='#fff';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText('မျောက်ဝံကြီး',b.x,b.y-55);drawHealthBar(b);}
for(const t of towers){if(t.hp<=0)continue;imageOrCircle(t.isBig?bigTowerImg:smallTowerImg,t.x,t.y,t.radius*2.5,t.radius*2.5,t.isEnemy?'#c33':'#36c');ctx.fillStyle='#111';ctx.fillRect(t.x-t.radius,t.y-t.radius-15,t.radius*2,6);ctx.fillStyle=t.isEnemy?'#e44':'#39f';ctx.fillRect(t.x-t.radius,t.y-t.radius-15,t.radius*2*t.hp/t.maxHp,6);}
for(const e of enemies)if(!e.isDead){drawHero(e,heroImgs[e.imgIndex],'#e74c3c');drawHealthBar(e);}
for(const a of allies)if(!a.isDead){drawHero(a,heroImgs[a.imgIndex],'#2ecc71');drawHealthBar(a);}
if(!player.isDead){drawHero(player,heroImgs[0],'#3498db');drawHealthBar(player);}
for(const b of bullets){ctx.fillStyle=b.team===0?'#f1c40f':'#ff5757';ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();}ctx.restore();}
function loop(){animClock++;update();draw();requestAnimationFrame(loop);}loop();
})();
</script></body></html>
